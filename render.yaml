# Import only into a confirmed Render workspace. This is a safe health-only template.
services:
  - type: web
    name: amplifyworld-api
    runtime: node
    plan: free
    branch: main
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @amplifyworld/shared build && pnpm --filter @amplifyworld/api build
    startCommand: node apps/api/dist/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: CLIENT_ORIGIN
        sync: false
      - key: INQUIRY_COLLECTION_ENABLED
        value: "false"
      - key: INQUIRY_PRIVACY_POLICY_APPROVED
        value: "false"
      - key: INQUIRY_EMAIL_ENABLED
        value: "false"
      - key: INQUIRY_RETENTION_CLEANUP_ENABLED
        value: "false"
      - key: INQUIRY_NOTIFICATION_WORKER_CONFIRMED
        value: "false"
      - key: TRUST_PROXY_HOPS
        value: "0"
